name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: python -m compileall -q src
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - run: python scripts/check_public_tree.py
      - run: python scripts/export_public.py --destination public-export
      - run: python -m build public-export --outdir dist
      - name: Test installed wheel outside the source checkout
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess, sys, tempfile, tomllib
          os_name, python_version = os.environ["DEMO_OS"], os.environ["DEMO_PYTHON"]
          wheel = next(pathlib.Path("dist").glob("*.whl")).resolve()
          subprocess.run([sys.executable, "-m", "pip", "install", "--force-reinstall", "--no-deps", str(wheel)], check=True)
          clean = pathlib.Path(tempfile.mkdtemp())
          destination = clean / "demo"
          subprocess.run([sys.executable, "-m", "portfolio_lab.cli", "demo", "--destination", str(destination)], cwd=clean, check=True)
          latest = json.loads((destination / "private/latest.json").read_text())
          manifest = destination / "private/runs" / latest["run_id"] / "manifest.json"
          subprocess.run([sys.executable, "-m", "portfolio_lab.cli", "verify", str(manifest), "--root", str(destination)], cwd=clean, check=True)
          subprocess.run([sys.executable, "-m", "portfolio_lab.cli", "replay", str(manifest), "--root", str(destination), "--destination", str(clean / "replay")], cwd=clean, check=True)
          if os_name == "ubuntu-latest" and python_version == "3.12":
              run_dir = manifest.parent
              decision = json.loads((run_dir / "decision.json").read_text())
              assert decision["data_kind"] == "synthetic"
              bundle = clean / "report-bundle"
              shutil.copytree(run_dir, bundle)
              shutil.copyfile("docs/demo/README.md", bundle / "README.md")
              shutil.make_archive(str(pathlib.Path("dist/synthetic-demo").resolve()), "zip", bundle)
              shutil.copyfile(run_dir / "Portfolio_Decision_Report.html", "dist/Portfolio_Decision_Report.html")
              version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
              changelog = pathlib.Path("CHANGELOG.md").read_text()
              heading = "## " + version + " - "
              assert heading in changelog, "Missing release changelog section"
              notes = changelog.split(heading, 1)[1].split("\n## ", 1)[0]
              pathlib.Path("dist/release-notes.md").write_text("## " + version + " - " + notes, encoding="utf8")
              assets = sorted(pathlib.Path("dist").iterdir())
              sums = "".join(hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n" for p in assets)
              pathlib.Path("dist/SHA256SUMS").write_text(sums, encoding="utf8")
        env:
          DEMO_OS: ${{ matrix.os }}
          DEMO_PYTHON: ${{ matrix.python }}
      - uses: actions/upload-artifact@v7
        with:
          name: public-source-${{ matrix.os }}-${{ matrix.python }}
          path: public-export/
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
